<div class="min-h-screen bg-gray-100 flex">
  <!-- Sidebar -->
  <aside class="w-64 bg-gray-900 text-white flex flex-col">
    <!-- Logo -->
    <!-- Volver a la página principal -->
    <div class="border-t border-gray-700 p-4">
      <a
        routerLink="/"
        class="flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-3 font-medium text-white transition hover:bg-blue-700"
      >
        <svg lucideHouse [size]="18" aria-hidden="true"></svg>

        Inicio
      </a>
    </div>
    <div class="p-6 border-b border-gray-700">
      <h1 class="text-2xl font-bold text-blue-400">CarRent</h1>

      <p class="text-sm text-gray-400 mt-1">Panel de administración</p>
    </div>

    <!-- Navegación -->
    <nav class="flex-1 p-4 space-y-2">
      <a
        routerLink="/admin"
        routerLinkActive="bg-blue-600"
        [routerLinkActiveOptions]="{ exact: true }"
        class="block px-4 py-3 rounded-lg hover:bg-gray-800 transition"
      >
        Dashboard
      </a>

      <a
        routerLink="/admin/cars"
        routerLinkActive="bg-blue-600"
        class="block px-4 py-3 rounded-lg hover:bg-gray-800 transition"
      >
        Vehículos
      </a>

      <a
        routerLink="/admin/car-models"
        routerLinkActive="bg-blue-600"
        class="block px-4 py-3 rounded-lg hover:bg-gray-800 transition"
      >
        Modelos
      </a>

      <a
        routerLink="/admin/offices"
        routerLinkActive="bg-blue-600"
        class="block px-4 py-3 rounded-lg hover:bg-gray-800 transition"
      >
        Oficinas
      </a>

      <a
        routerLink="/admin/reservations"
        routerLinkActive="bg-blue-600"
        class="block px-4 py-3 rounded-lg hover:bg-gray-800 transition"
      >
        Reservas
      </a>
    </nav>
  </aside>

  <!-- Contenido principal -->
  <main class="flex-1 p-8">
    <router-outlet></router-outlet>
  </main>
</div>
