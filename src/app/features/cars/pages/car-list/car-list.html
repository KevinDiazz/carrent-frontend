<section class="py-16 bg-gray-50 min-h-screen">
  <div class="max-w-7xl mx-auto px-6">
    <!-- Header -->
    <div class="text-center max-w-2xl mx-auto mb-12">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-900">Encuentra tu coche</h1>

      <p class="mt-4 text-gray-600">Elige dónde y cuándo necesitas tu coche.</p>
    </div>

    <!-- Search form -->
    <form
      [formGroup]="searchForm"
      (ngSubmit)="searchCars()"
      class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 mb-12"
    >
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        <!-- Office -->
        <div>
          <label for="officeId" class="block text-sm font-medium text-gray-700 mb-2">
            Oficina
          </label>

          <select
            id="officeId"
            formControlName="officeId"
            class="w-full h-12 px-4 border border-gray-300 rounded-lg bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">Selecciona una oficina</option>
            <option value="1">Aeropuerto de Gran Canaria</option>
            <option value="3">Oficina de Maspalomas</option>
          </select>
        </div>

        <!-- Start date -->
        <div>
          <label for="startDate" class="block text-sm font-medium text-gray-700 mb-2">
            Fecha de recogida
          </label>

          <input
            id="startDate"
            type="date"
            formControlName="startDate"
            class="w-full h-12 px-4 border border-gray-300 rounded-lg bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- End date -->
        <div>
          <label for="endDate" class="block text-sm font-medium text-gray-700 mb-2">
            Fecha de devolución
          </label>

          <input
            id="endDate"
            type="date"
            formControlName="endDate"
            class="w-full h-12 px-4 border border-gray-300 rounded-lg bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
      </div>

      <!-- Search button -->
      <div class="mt-6 flex justify-center">
        <button
          type="submit"
          class="w-full md:w-auto px-8 h-12 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition"
        >
          Buscar coches
        </button>
      </div>
    </form>

    <!-- Results -->
    @if (cars().length > 0) {
      <!-- Mobile filters button -->
      <div class="lg:hidden flex justify-end mb-5">
        <button
          type="button"
          (click)="filtersOpen.set(true)"
          class="inline-flex items-center gap-2 px-4 py-2.5 bg-white border border-gray-200 rounded-lg shadow-sm text-sm font-semibold text-gray-700 hover:bg-gray-50 transition"
        >
          <!-- Filter icon -->
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 5h18M6 12h12M10 19h4"
            />
          </svg>

          Filtros
        </button>
      </div>

      <!-- Desktop results -->
      <div class="grid grid-cols-1 lg:grid-cols-[220px_1fr] gap-8">
        <!-- Desktop filters -->
        <aside
          class="hidden lg:block bg-white rounded-2xl shadow-sm border border-gray-200 p-5 h-fit"
        >
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-semibold text-gray-900">Filtros</h2>

            <button
              type="button"
              (click)="fuelFilter.set(''); transmissionFilter.set(''); sortPrice.set('')"
              class="text-sm text-blue-600 hover:text-blue-700 font-medium"
            >
              Limpiar
            </button>
          </div>

          <!-- Fuel -->
          <div class="mb-6">
            <label
              for="fuelFilterDesktop"
              class="flex items-center gap-2 text-sm font-medium text-gray-700 mb-2"
            >
              <svg
                class="w-4 h-4 text-gray-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 10h10M5 10V5a2 2 0 012-2h6a2 2 0 012 2v5m-2 0h2a2 2 0 012 2v5a2 2 0 01-2 2h-2m-8-9v9m4-9v9"
                />
              </svg>

              Combustible
            </label>

            <select
              id="fuelFilterDesktop"
              [value]="fuelFilter()"
              (change)="fuelFilter.set($any($event.target).value)"
              class="w-full h-11 px-3 border border-gray-300 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option value="">Todos</option>
              <option value="PETROL">Gasolina</option>
              <option value="HYBRID">Híbrido</option>
              <option value="ELECTRIC">Eléctrico</option>
            </select>
          </div>

          <!-- Transmission -->
          <div class="mb-6">
            <label
              for="transmissionFilterDesktop"
              class="flex items-center gap-2 text-sm font-medium text-gray-700 mb-2"
            >
              <svg
                class="w-4 h-4 text-gray-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16M8 6v12"
                />
              </svg>

              Transmisión
            </label>

            <select
              id="transmissionFilterDesktop"
              [value]="transmissionFilter()"
              (change)="transmissionFilter.set($any($event.target).value)"
              class="w-full h-11 px-3 border border-gray-300 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option value="">Todas</option>
              <option value="MANUAL">Manual</option>
              <option value="AUTOMATIC">Automático</option>
            </select>
          </div>

          <!-- Price -->
          <div>
            <label
              for="sortPriceDesktop"
              class="flex items-center gap-2 text-sm font-medium text-gray-700 mb-2"
            >
              <svg
                class="w-4 h-4 text-gray-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 8c-1.1 0-2 .67-2 1.5S10.9 11 12 11s2 .67 2 1.5S13.1 14 12 14m0-6V6m0 8v2m6-4a6 6 0 11-12 0 6 6 0 01-12 0z"
                />
              </svg>

              Ordenar por precio
            </label>

            <select
              id="sortPriceDesktop"
              [value]="sortPrice()"
              (change)="sortPrice.set($any($event.target).value)"
              class="w-full h-11 px-3 border border-gray-300 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option value="">Predeterminado</option>
              <option value="asc">Menor a mayor</option>
              <option value="desc">Mayor a menor</option>
            </select>
          </div>
        </aside>

        <!-- Cars -->
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
          @for (car of filteredCars(); track $index) {
            <app-available-car-card
              [car]="car"
              [officeId]="searchForm.value.officeId!"
              [startDate]="searchForm.value.startDate!"
              [endDate]="searchForm.value.endDate!"
              [pickupTime]="pickupTime"
              [returnTime]="returnTime"
            />
          }
        </div>
      </div>

      <!-- Mobile filters modal -->
      @if (filtersOpen()) {
        <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center">
          <div class="w-full sm:max-w-md bg-white rounded-t-2xl sm:rounded-2xl p-6 shadow-xl">
            <!-- Modal header -->
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-semibold text-gray-900">Filtros</h2>

              <button
                type="button"
                (click)="filtersOpen.set(false)"
                class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 transition"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                  />
                </svg>
              </button>
            </div>

            <!-- Fuel -->
            <div class="mb-6">
              <label
                for="fuelFilterMobile"
                class="flex items-center gap-2 text-sm font-medium text-gray-700 mb-2"
              >
                Combustible
              </label>

              <select
                id="fuelFilterMobile"
                [value]="fuelFilter()"
                (change)="fuelFilter.set($any($event.target).value)"
                class="w-full h-11 px-3 border border-gray-300 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="">Todos</option>
                <option value="PETROL">Gasolina</option>
                <option value="HYBRID">Híbrido</option>
                <option value="ELECTRIC">Eléctrico</option>
              </select>
            </div>

            <!-- Transmission -->
            <div class="mb-6">
              <label
                for="transmissionFilterMobile"
                class="flex items-center gap-2 text-sm font-medium text-gray-700 mb-2"
              >
                Transmisión
              </label>

              <select
                id="transmissionFilterMobile"
                [value]="transmissionFilter()"
                (change)="transmissionFilter.set($any($event.target).value)"
                class="w-full h-11 px-3 border border-gray-300 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="">Todas</option>
                <option value="MANUAL">Manual</option>
                <option value="AUTOMATIC">Automático</option>
              </select>
            </div>

            <!-- Price -->
            <div class="mb-6">
              <label
                for="sortPriceMobile"
                class="flex items-center gap-2 text-sm font-medium text-gray-700 mb-2"
              >
                Ordenar por precio
              </label>

              <select
                id="sortPriceMobile"
                [value]="sortPrice()"
                (change)="sortPrice.set($any($event.target).value)"
                class="w-full h-11 px-3 border border-gray-300 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="">Predeterminado</option>
                <option value="asc">Menor a mayor</option>
                <option value="desc">Mayor a menor</option>
              </select>
            </div>

            <!-- Actions -->
            <div class="flex gap-3">
              <button
                type="button"
                (click)="fuelFilter.set(''); transmissionFilter.set(''); sortPrice.set('')"
                class="flex-1 h-11 border border-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-50 transition"
              >
                Limpiar
              </button>

              <button
                type="button"
                (click)="filtersOpen.set(false)"
                class="flex-1 h-11 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition"
              >
                Ver resultados
              </button>
            </div>
          </div>
        </div>
      }
    }
  </div>
</section>
