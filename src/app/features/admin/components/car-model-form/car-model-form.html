<form [formGroup]="carModelForm" (ngSubmit)="onSubmit()" class="rounded-xl bg-white p-6 shadow-sm">
  <h2 class="mb-6 text-xl font-semibold text-gray-800">
    {{ carModelToEdit() ? 'Editar modelo' : 'Añadir modelo' }}
  </h2>

  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
    <div>
      <label for="brand" class="mb-2 block text-sm font-medium text-gray-700"> Marca </label>

      <input
        id="brand"
        type="text"
        formControlName="brand"
        placeholder="Ej. Toyota"
        class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />

      @if (carModelForm.controls.brand.invalid && carModelForm.controls.brand.touched) {
        <p class="mt-1 text-sm text-red-600">La marca es obligatoria.</p>
      }
    </div>

    <div>
      <label for="model" class="mb-2 block text-sm font-medium text-gray-700"> Modelo </label>

      <input
        id="model"
        type="text"
        formControlName="model"
        placeholder="Ej. Yaris"
        class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />

      @if (carModelForm.controls.model.invalid && carModelForm.controls.model.touched) {
        <p class="mt-1 text-sm text-red-600">El modelo es obligatorio.</p>
      }
    </div>
  </div>

  <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
    <button
      type="button"
      (click)="cancelled.emit()"
      class="rounded-lg border border-gray-300 px-5 py-2.5 text-sm font-medium text-gray-700 transition hover:bg-gray-50"
    >
      Cancelar
    </button>

    <button
      type="submit"
      class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-blue-700"
    >
      {{ carModelToEdit() ? 'Guardar cambios' : 'Añadir modelo' }}
    </button>
  </div>
</form>
