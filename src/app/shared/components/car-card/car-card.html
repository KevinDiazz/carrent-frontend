<article
  class="bg-white rounded-2xl overflow-hidden shadow-sm
         border hover:shadow-lg transition border-r-8 border-[#9dd0f6]"
>

  <!-- Image -->
  <div class="relative h-52 bg-gray-100 overflow-hidden ">

    <img
      [src]="car.image"
      [alt]="car.name"
      class="w-full h-auto object-cover p-2 rounded-2xl"
    />


  </div>


  <!-- Content -->
  <div class="p-5">

    <!-- Name -->
    <h3 class="text-xl font-semibold text-gray-900">
      {{ car.name }}
    </h3>


    <!-- Fuel types -->
    <div class="mt-3">

      <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">
        Combustible
      </p>

      <div class="flex flex-wrap gap-2">

        @for (fuel of car.fuelTypes; track fuel) {

          <span
            class="px-2.5 py-1 bg-blue-50 text-blue-700
                   text-sm rounded-full"
          >
            {{ fuel }}
          </span>

        }

      </div>

    </div>


    <!-- Transmissions -->
    <div class="mt-3">

      <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">
        Cambio
      </p>

      <div class="flex flex-wrap gap-2">

        @for (transmission of car.transmissions; track transmission) {

          <span
            class="px-2.5 py-1 bg-gray-100 text-gray-700
                   text-sm rounded-full"
          >
            {{ transmission }}
          </span>

        }

      </div>

    </div>


    <!-- Bottom -->
    <div class="mt-5 flex items-end justify-between">

      <div>

        <span class="text-2xl font-bold text-gray-900">
          {{ car.pricePerDay }} €
        </span>

        <span class="text-sm text-gray-500">
          / día
        </span>

      </div>

      <button
        type="button"
        class="px-4 py-2 bg-blue-600 text-white text-sm
               font-semibold rounded-lg hover:bg-blue-700 transition"
      >
        Ver coche
      </button>

    </div>

  </div>

</article>
